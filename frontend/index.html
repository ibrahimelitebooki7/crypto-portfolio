<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Crypto Portfolio – Adaptive Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ethers.js for wallet connection -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <!-- Axios for API calls -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    /* custom spinner */
    .loader {
      border: 3px solid #f3f4f6;
      border-top: 3px solid #10b981;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-10">
      <h1 class="text-3xl font-bold text-gray-900">💰 Adaptive Portfolio</h1>
      <button id="connectWalletBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-xl shadow transition">Connect Wallet</button>
      <button id="disconnectWalletBtn" class="hidden bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-6 rounded-xl shadow transition">Disconnect</button>
    </div>

    <!-- Wallet info -->
    <div id="walletInfo" class="hidden mb-6 p-3 bg-gray-200 rounded-xl text-sm font-mono break-all"></div>

    <!-- Loading state -->
    <div id="loadingSpinner" class="hidden loader"></div>

    <!-- Portfolio content -->
    <div id="portfolioContent" class="hidden space-y-8">
      <!-- Total value card -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h2 class="text-xl font-semibold">Total Portfolio Value</h2>
        <p id="totalUsd" class="text-4xl font-bold text-green-600">$0.00</p>
      </div>

      <!-- Risk alert -->
      <div id="riskAlert" class="hidden bg-red-50 p-4 rounded-xl border border-red-200">
        <p class="text-red-700"></p>
      </div>

      <!-- Tokens table -->
      <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
        <div class="p-4 border-b font-semibold text-lg">🪙 Token Balances</div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-gray-50">
              <tr>
                <th class="p-3 text-left">Token</th>
                <th class="p-3 text-left">Balance</th>
                <th class="p-3 text-left">Price</th>
                <th class="p-3 text-left">Value (USD)</th>
              </tr>
            </thead>
            <tbody id="tokenTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- DeFi positions placeholder (optional) -->
      <div id="defiSection" class="hidden bg-white rounded-2xl shadow-sm border p-4">
        <h2 class="font-semibold text-lg mb-3">🏦 DeFi Positions</h2>
        <div id="defiList"></div>
      </div>
    </div>
  </main>

  <script>
    // =============== CONFIGURATION ===============
    // Your Covalent API key (client‑side – anyone can see it. Use backend proxy for production)
    const COVALENT_API_KEY = "cqt_rQXRpH6mDQRRgxPfGK84XtT6Dbk8";
    // Zerion API key (optional)
    const ZERION_API_KEY = "zk_a9d9950f4d33453288b466833ba98bd8";
    // Default chain ID (Ethereum mainnet = 1)
    let currentChainId = 1;
    let provider, signer, userAddress;

    // DOM elements
    const connectBtn = document.getElementById('connectWalletBtn');
    const disconnectBtn = document.getElementById('disconnectWalletBtn');
    const walletInfoDiv = document.getElementById('walletInfo');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const portfolioContent = document.getElementById('portfolioContent');
    const totalUsdSpan = document.getElementById('totalUsd');
    const tokenBody = document.getElementById('tokenTableBody');
    const riskAlertDiv = document.getElementById('riskAlert');
    const defiSection = document.getElementById('defiSection');
    const defiListDiv = document.getElementById('defiList');

    // Helper: format number with commas
    function formatNumber(num, decimals = 2) {
      if (num === undefined || num === null) return '$0.00';
      return num.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    // Fetch token balances from Covalent
    async function fetchTokens(address, chainId) {
      const url = `https://api.covalenthq.com/v1/${chainId}/address/${address}/balances_v2/?key=${COVALENT_API_KEY}`;
      try {
        const res = await axios.get(url);
        const items = res.data.data?.items || [];
        const nonZero = items.filter(t => Number(t.balance) > 0);
        const formatted = nonZero.map(t => ({
          name: t.contract_name,
          symbol: t.contract_ticker_symbol,
          balance: (Number(t.balance) / Math.pow(10, t.contract_decimals)).toFixed(4),
          quote: t.quote || 0,
          quote_rate: t.quote_rate || 0,
          logo: t.logo_url || ''
        }));
        return formatted;
      } catch (err) {
        console.error('Covalent error:', err);
        return [];
      }
    }

    // Fetch DeFi positions from Zerion (optional)
    async function fetchDefi(address) {
      if (!ZERION_API_KEY) return [];
      try {
        const url = `https://api.zerion.io/v1/wallets/${address}/positions?currency=usd`;
        const res = await axios.get(url, { headers: { Authorization: `Bearer ${ZERION_API_KEY}` } });
        return res.data.data || [];
      } catch (err) {
        console.log('Zerion not available');
        return [];
      }
    }

    // Simulated risk alert (volatility)
    async function checkRisk() {
      // Simulate random volatility between 0-10%
      const volatility = Math.random() * 10;
      if (volatility > 5) {
        riskAlertDiv.classList.remove('hidden');
        riskAlertDiv.querySelector('p').innerHTML = `⚠️ High ETH volatility: ${volatility.toFixed(1)}% (simulated)`;
      } else {
        riskAlertDiv.classList.add('hidden');
      }
    }

    // Main portfolio loader
    async function loadPortfolio(address, chainId) {
      loadingSpinner.classList.remove('hidden');
      portfolioContent.classList.add('hidden');
      try {
        // Fetch tokens
        const tokens = await fetchTokens(address, chainId);
        const total = tokens.reduce((sum, t) => sum + (t.quote || 0), 0);
        totalUsdSpan.innerText = `$${formatNumber(total, 2)}`;

        // Render table
        tokenBody.innerHTML = '';
        tokens.forEach(t => {
          const row = document.createElement('tr');
          row.className = 'border-t';
          row.innerHTML = `
            <td class="p-3 flex items-center gap-2">
              <img src="${t.logo || 'https://placehold.co/24x24'}" class="w-6 h-6 rounded-full" onerror="this.src='https://placehold.co/24x24'" />
              ${t.name} (${t.symbol})
            </td>
            <td class="p-3">${t.balance}</td>
            <td class="p-3">$${t.quote_rate ? t.quote_rate.toFixed(4) : '0.0000'}</td>
            <td class="p-3 font-medium">$${t.quote ? t.quote.toFixed(2) : '0.00'}</td>
          `;
          tokenBody.appendChild(row);
        });

        // DeFi positions (optional)
        const defi = await fetchDefi(address);
        if (defi.length > 0) {
          defiSection.classList.remove('hidden');
          defiListDiv.innerHTML = '';
          defi.slice(0, 5).forEach(pos => {
            const div = document.createElement('div');
            div.className = 'flex justify-between border-b py-2';
            div.innerHTML = `<span>${pos.protocol || 'Unknown'} – ${pos.asset || 'Asset'}</span>
                             <span>$${(pos.value_usd || 0).toFixed(2)}</span>`;
            defiListDiv.appendChild(div);
          });
        } else {
          defiSection.classList.add('hidden');
        }

        // Risk alert
        await checkRisk();

        portfolioContent.classList.remove('hidden');
      } catch (err) {
        console.error('Failed to load portfolio', err);
        alert('Error loading portfolio. Check console.');
      } finally {
        loadingSpinner.classList.add('hidden');
      }
    }

    // Wallet connection logic using ethers.js
    async function connectWallet() {
      if (!window.ethereum) {
        alert('Please install MetaMask or another Web3 wallet.');
        return;
      }
      try {
        const providerWeb3 = new ethers.BrowserProvider(window.ethereum);
        const accounts = await providerWeb3.send("eth_requestAccounts", []);
        userAddress = accounts[0];
        const network = await providerWeb3.getNetwork();
        currentChainId = Number(network.chainId);
        provider = providerWeb3;

        walletInfoDiv.innerText = `Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)} (Chain ID: ${currentChainId})`;
        walletInfoDiv.classList.remove('hidden');
        connectBtn.classList.add('hidden');
        disconnectBtn.classList.remove('hidden');

        // Load portfolio
        await loadPortfolio(userAddress, currentChainId);
      } catch (err) {
        console.error(err);
        alert('Connection failed.');
      }
    }

    function disconnectWallet() {
      userAddress = null;
      walletInfoDiv.classList.add('hidden');
      connectBtn.classList.remove('hidden');
      disconnectBtn.classList.add('hidden');
      portfolioContent.classList.add('hidden');
      // Note: cannot force disconnect from provider, but we forget the address.
    }

    connectBtn.addEventListener('click', connectWallet);
    disconnectBtn.addEventListener('click', disconnectWallet);

    // Listen for chain change
    if (window.ethereum) {
      window.ethereum.on('chainChanged', (chainIdHex) => {
        currentChainId = parseInt(chainIdHex, 16);
        if (userAddress) loadPortfolio(userAddress, currentChainId);
      });
      window.ethereum.on('accountsChanged', (accounts) => {
        if (accounts.length === 0) disconnectWallet();
        else if (accounts[0] !== userAddress) {
          userAddress = accounts[0];
          if (userAddress) loadPortfolio(userAddress, currentChainId);
        }
      });
    }
  </script>
</body>
</html>
